<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f8a4c">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NutriLift">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <title>NutriLift</title>
</head>
<body>
  <!-- 起動中表示 -->
  <div id="splash" class="splash">読み込み中…</div>

  <!-- ログイン画面 -->
  <main id="login-screen" class="login" hidden></main>

  <!-- ログイン後のアプリ本体 -->
  <div id="app" hidden>
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar">
      <a href="#/today" data-tab="today"><span class="ico" aria-hidden="true">🍽</span>今日</a>
      <a href="#/recipes" data-tab="recipes"><span class="ico" aria-hidden="true">📖</span>レシピ</a>
      <a href="#/history" data-tab="history"><span class="ico" aria-hidden="true">📈</span>履歴</a>
      <a href="#/settings" data-tab="settings"><span class="ico" aria-hidden="true">⚙️</span>設定</a>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
